# Add pods when the average CPU use is above 50% of the request, up to 8 pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spamfilter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spamfilter
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
