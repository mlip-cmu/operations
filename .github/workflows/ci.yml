name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.16.10 check .
      - run: uvx ruff@0.16.10 format --check .

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [01-container, 02-compose, 03-ansible, 04-kubernetes, 05-monitoring]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install minikube
        if: matrix.project == '04-kubernetes'
        run: |
          curl -sSLo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube /usr/local/bin/minikube
      - name: Install the browser for the dashboard screenshot
        if: matrix.project == '05-monitoring'
        run: uv run --project 05-monitoring playwright install --with-deps chromium
      - run: ./run_all.sh ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.project }}
          path: |
            ${{ matrix.project }}/transcript.txt
            ${{ matrix.project }}/out/
            ${{ matrix.project }}/*.png
          if-no-files-found: ignore
