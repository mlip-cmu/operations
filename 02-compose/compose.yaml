name: blog

services:
  blog:
    build: ./blog
    ports:
      - "8080:8000"
    environment:
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./blog
    command: ["python", "-m", "blog.worker"]
    environment:
      REDIS_URL: redis://redis:6379
      SPAMFILTER_URL: http://spamfilter:8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  spamfilter:
    build:
      context: ../01-container
      args:
        APP_VERSION: "1.0"
    image: spamfilter:1.0
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

volumes:
  redis-data:
